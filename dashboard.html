<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات Arabic Subtitles Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8a2be2;
            --bg: #0f0a1a;
            --card: #1a1428;
            --text: #ffffff;
            --subtext: #b1a7c1;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #2a1a4a, var(--bg));
        }

        .container {
            background: var(--card);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(138, 43, 226, 0.2);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: inline-block;
            background: linear-gradient(45deg, #8a2be2, #00d2ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        p {
            color: var(--subtext);
            margin: 0.5rem 0 2rem;
        }

        .feature-list {
            text-align: right;
            margin-bottom: 2rem;
            padding: 0;
            list-style: none;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px;
            border-radius: 10px;
        }

        .feature-item i {
            margin-left: 10px;
            color: var(--primary);
        }

        .install-btn {
            background: linear-gradient(45deg, var(--primary), #4b0082);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            font-size: 1.1rem;
        }

        .install-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
        }

        .settings-box {
            text-align: right;
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }

        .setting-item {
            margin-bottom: 1.5rem;
        }

        .setting-item label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--subtext);
            font-size: 0.9rem;
        }

        .setting-item select,
        .setting-item input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            background: #251b3d;
            color: white;
            font-family: inherit;
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: var(--subtext);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">✨</div>
        <div class="version">v2.0.0</div>
        <h1>Arabic Subtitles Pro</h1>
        <p>الإصدار النهائي - v2.0.0 - دعم متعدد اللغات</p>

        <div class="feature-list">
            <div class="feature-item">
                <span>⚡ نظام ترتيب يعتمد على تشابه الأسماء (Fuzzy Match)</span>
            </div>
            <div class="feature-item">
                <span>🎯 أولوية قصوى لمصادر SubSource و SubDL الأصلية</span>
            </div>
            <div class="feature-item">
                <span>💎 مفاتيح API مدمجة وتلقائية</span>
            </div>
            <div class="feature-item">
                <span>🛠️ حفظ الإعدادات التلقائي عند التثبيت</span>
            </div>
        </div>

        <div class="settings-box">
            <div class="setting-item">
                <label>اللغة المفضلة:</label>
                <select id="lang" onchange="updateUrlPreview()">
                    <option value="ara" selected>العربية (Arabic)</option>
                    <option value="eng">الإنجليزية (English)</option>
                    <option value="fre">الفرنسية (French)</option>
                    <option value="spa">الإسبانية (Spanish)</option>
                    <option value="ger">الألمانية (German)</option>
                    <option value="ita">الإيطالية (Italian)</option>
                    <option value="rus">الروسية (Russian)</option>
                    <option value="tur">التركية (Turkish)</option>
                </select>
            </div>
            <div class="setting-item">
                <label>نتائج OpenSubtitles (بحد أقصى):</label>
                <input type="number" id="osCount" value="5" min="1" max="15" onchange="updateUrlPreview()">
            </div>
            <div class="setting-item">
                <label>نتائج YTS (بحد أقصى):</label>
                <input type="number" id="ytsCount" value="3" min="1" max="10" onchange="updateUrlPreview()">
            </div>
            <div class="setting-item">
                <label>مفتاح SubDL (اختياري):</label>
                <input type="text" id="subdlKey" placeholder="أدخل مفتاح SubDL هنا" onchange="updateUrlPreview()">
            </div>
            <div class="setting-item">
                <label>مفتاح SubSource (اختياري):</label>
                <input type="text" id="subsourceKey" placeholder="أدخل مفتاح SubSource هنا"
                    onchange="updateUrlPreview()">
            </div>

            <!-- Preview Removed for Production -->

            <button id="mainBtn" class="install-btn" onclick="installAddon()">تثبيت الإضافة بالإعدادات المختارة</button>

            <div class="footer">
                مدعوم بواسطة Stremio Addon SDK
            </div>
        </div>

        <script>
            function getManifestUrl() {
                const lang = document.getElementById('lang').value;
                const osCount = document.getElementById('osCount').value;
                const ytsCount = document.getElementById('ytsCount').value;
                const subdlKey = document.getElementById('subdlKey').value;
                const subsourceKey = document.getElementById('subsourceKey').value;

                const config = {
                    lang: lang,
                    osCount: osCount,
                    ytsCount: ytsCount,
                    subdlKey: subdlKey,
                    subsourceKey: subsourceKey
                };

                const configStr = btoa(JSON.stringify(config)); // URL-safe Base64

                let domain = window.location.host;
                let protocol = window.location.protocol;

                if (!domain || domain === "" || protocol === 'file:') {
                    domain = "127.0.0.1:7000";
                    protocol = "http:";
                }

                return `${protocol}//${domain}/${configStr}/manifest.json`;
            }

            function updateUrlPreview() {
                const url = getManifestUrl();
                document.getElementById('manifestPreview').value = url;
            }

            function copyToClipboard(event) {
                const copyText = document.getElementById("manifestPreview");
                const copyBtn = event.currentTarget;
                const originalText = copyBtn.innerText;

                copyText.select();
                copyText.setSelectionRange(0, 99999);

                try {
                    document.execCommand("copy");
                    copyBtn.innerText = "تم النسخ!";
                    copyBtn.style.background = "#28a745";

                    setTimeout(() => {
                        copyBtn.innerText = originalText;
                        copyBtn.style.background = "#33215c";
                    }, 2000);
                } catch (err) {
                    alert("فشل النسخ التلقائي، يرجى النسخ يدوياً.");
                }
            }

            function installAddon() {
                const manifestUrl = getManifestUrl();
                const stremioUrl = manifestUrl.replace("https://", "stremio://").replace("http://", "stremio://");
                console.log("Installing with:", stremioUrl);
                window.location.href = stremioUrl;
            }

            // Initial preview
            updateUrlPreview();

            // Populate from URL if exists
            // Populate from URL if exists
            function initFromUrl() {
                try {
                    const path = window.location.pathname;
                    const parts = path.split('/');
                    const configStr = parts.length > 2 ? parts[1] : null;

                    if (configStr && !configStr.includes('configure') && configStr.length > 5) {
                        const decoded = atob(configStr);
                        // Check if it's JSON
                        if (decoded.startsWith('{')) {
                            const config = JSON.parse(decoded);
                            if (config.lang) document.getElementById('lang').value = config.lang;
                            if (config.osCount) document.getElementById('osCount').value = config.osCount;
                            if (config.ytsCount) document.getElementById('ytsCount').value = config.ytsCount;
                            if (config.subdlKey) document.getElementById('subdlKey').value = config.subdlKey;
                            if (config.subsourceKey) document.getElementById('subsourceKey').value = config.subsourceKey;
                        }
                        updateUrlPreview();
                    }
                } catch (e) { console.log('Parsed config error', e); }
            }
            }
        }
            initFromUrl();
        </script>
</body>

</html>
