<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">إعدادات ST+</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8a2be2;
            --bg: #0f0a1a;
            --card: #1a1428;
            --text: #ffffff;
            --subtext: #b1a7c1;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at top right, #2a1a4a, var(--bg));
        }

        .container {
            background: var(--card);
            padding: 1.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(138, 43, 226, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        /* LTR Override for English */
        html[lang="en"] .container {
            text-align: left;
        }

        html[lang="ar"] .container {
            text-align: right;
        }

        /* Center alignment for header elements regardless of lang */
        html[lang="ar"] .container>h1,
        html[lang="ar"] .container>p,
        html[lang="ar"] .container>.version,
        html[lang="ar"] .container>.logo,
        html[lang="en"] .container>h1,
        html[lang="en"] .container>p,
        html[lang="en"] .container>.version,
        html[lang="en"] .container>.logo {
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: inline-block;
            background: linear-gradient(45deg, #8a2be2, #00d2ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            margin-bottom: 0.2rem;
        }

        p {
            color: var(--subtext);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .feature-list {
            margin-bottom: 1.5rem;
            padding: 0;
            list-style: none;
            font-size: 0.85rem;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px;
            border-radius: 10px;
        }

        .feature-item span {
            margin: 0 10px;
        }

        .install-btn {
            background: linear-gradient(45deg, var(--primary), #4b0082);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            width: 100%;
            margin-top: 1rem;
        }

        .install-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
        }

        .settings-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.2rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
        }

        .setting-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 1rem;
        }

        .setting-item {
            margin-bottom: 1rem;
        }

        .setting-item label {
            display: block;
            margin-bottom: 0.3rem;
            color: var(--subtext);
            font-size: 0.85rem;
        }

        .setting-item select,
        .setting-item input {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(138, 43, 226, 0.3);
            background: #251b3d;
            color: white;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        /* Ensure Inputs within Grid align nicely */
        .setting-grid .setting-item {
            margin-bottom: 0;
        }

        .api-link {
            display: block;
            margin-top: 5px;
            font-size: 0.75rem;
            color: var(--primary);
            text-decoration: none;
            opacity: 0.8;
        }

        .api-link:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .footer {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--subtext);
            text-align: center;
        }

        /* Language Switcher Top Right */
        .interface-lang {
            position: absolute;
            top: 1rem;
            right: 1rem;
            /* Default for RTL */
        }

        html[lang="en"] .interface-lang {
            right: auto;
            left: 1rem;
        }

        html[lang="ar"] .interface-lang {
            right: auto;
            left: 1rem;
        }

        .interface-lang select {
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 5px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            width: auto;
        }
    </style>
</head>

<body>

            <option value="zh">🇨🇳 中文</option>
        </select>
    </div>

            <div style="text-align: left;">
                <h1 data-i18n="title" style="margin: 0; font-size: 2rem; line-height: 1;">ST+</h1>
                <div class="version" style="font-size: 0.8rem; opacity: 0.7; margin-top: 5px;">v2.3.0</div>
            </div>
        </div>
        <p data-i18n="subtitle">Multi-Language Subtitles</p>

        <!-- Compact Feature List -->
        <div class="feature-list">
            <div class="feature-item">
                <span data-i18n="feature1">⚡ Smart Ranking System (Fuzzy Match)</span>
            </div>
            <div class="feature-item">
                <span data-i18n="feature2">🎯 Supports: SubSource, SubDL, OpenSubtitles, YTS</span>
            </div>
        </div>

        <div class="settings-box">

            <!-- 1. Preferred Language (Full Width) -->
            <div class="setting-item">
                <label data-i18n="lblSubLang">لغة الترجمة المفضلة:</label>
                <select id="lang">
                    <option value="ara" selected>العربية</option>
                    <option value="eng">English</option>
                    <option value="fre">Français</option>
                    <option value="spa">Español</option>
                    <option value="ger">Deutsch</option>
                    <option value="ita">Italiano</option>
                    <option value="rus">Русский</option>
                    <option value="tur">Türkçe</option>
                    <option value="por">Português</option>
                    <option value="dut">Nederlands</option>
                    <option value="chi">中文 (Chinese)</option>
                </select>
            </div>

            <!-- 2. Result Counters Grid (2x2) -->
            <div class="setting-grid">
                <!-- OpenSubtitles -->
                <div class="setting-item">
                    <label data-i18n="lblOsCount">OpenSubtitles:</label>
                    <input type="number" id="osCount" value="5" min="1" max="20">
                </div>
                <!-- YTS -->
                <div class="setting-item">
                    <label data-i18n="lblYtsCount">YTS:</label>
                    <input type="number" id="ytsCount" value="3" min="1" max="10">
                </div>
                <!-- SubDL Limit -->
                <div class="setting-item">
                    <label data-i18n="lblSubdlLimit">SubDL:</label>
                    <input type="number" id="subdlLimit" value="5" min="1" max="20">
                </div>
                <!-- SubSource Limit -->
                <div class="setting-item">
                    <label data-i18n="lblSubsourceLimit">SubSource:</label>
                    <input type="number" id="subsourceLimit" value="5" min="1" max="20">
                </div>
            </div>

            <!-- 3. API Keys (Full Width Stacks) -->
            <div
                style="margin-top: 1.5rem; margin-bottom: 1rem; font-weight: bold; color: var(--primary); font-size: 1.1rem;">
                <span data-i18n="lblMoreSubs">للحصول على مزيد من الترجمات:</span>
            </div>

            <div class="setting-item">
                <label data-i18n="lblSubdlKey">مفتاح SubDL (اختياري):</label>
                <input type="text" id="subdlKey" placeholder="API Key...">
                <a href="https://subdl.strem.top" target="_blank" class="api-link" data-i18n="linkGetKey">🔗 احصل على
                    مفتاحك من هنا</a>
            </div>

            <div class="setting-item" style="margin-bottom: 0;">
                <label data-i18n="lblSubsourceKey">مفتاح SubSource (اختياري):</label>
                <input type="text" id="subsourceKey" placeholder="API Key...">
                <a href="https://subsource.strem.top" target="_blank" class="api-link" data-i18n="linkGetKey">🔗 احصل
                    على مفتاحك من هنا</a>
            </div>

        </div>

        <button id="mainBtn" class="install-btn" onclick="installAddon()" data-i18n="btnInstall">تثبيت الإضافة</button>

        <div class="footer" data-i18n="footer">
            مدعوم بواسطة Stremio Addon SDK
        </div>
    </div>

    <script>
        const translations = {
            ar: {
                // Unicode LRE (\u202A) start LTR embedding, PDF (\u202C) pop directional formatting
                // This ensures "ST+" is treated as an LTR block inside the Arabic RTL context.
                pageTitle: "إعدادات \u202AST+\u202C",
                title: "<span dir='ltr'>ST+</span>",
                subtitle: "ترجمات متعددة اللغات - v2.3.0",
                feature1: "⚡ نظام ترتيب ذكي (Fuzzy Match)",
                feature2: "🎯 دعم شامل: SubSource, SubDL, OpenSubtitles, YTS",
                lblMoreSubs: "للحصول على مزيد من الترجمات:",
                lblSubLang: "لغة الترجمة المفضلة:",
                lblOsCount: "نتائج OpenSubtitles:",
                lblYtsCount: "نتائج YTS:",
                lblSubdlLimit: "نتائج SubDL:",
                lblSubdlKey: "مفتاح SubDL (اختياري):",
                lblSubsourceLimit: "نتائج SubSource:",
                lblSubsourceKey: "مفتاح SubSource (اختياري):",
                linkGetKey: "🔗 احصل على مفتاحك من هنا",
                btnInstall: "تثبيت الإضافة",
                footer: "مدعوم بواسطة Stremio Addon SDK"
            },
            en: {
                pageTitle: "ST+ Settings",
                title: "ST+",
                subtitle: "Multi-Language Subtitles - v2.3.0",
                feature1: "⚡ Smart Ranking System (Fuzzy Match)",
                feature2: "🎯 Supports: SubSource, SubDL, OpenSubtitles, YTS",
                lblMoreSubs: "For more subtitles:",
                lblSubLang: "Preferred Subtitle Language:",
                lblOsCount: "OpenSubtitles Results:",
                lblYtsCount: "YTS Results:",
                lblSubdlLimit: "SubDL Results:",
                lblSubdlKey: "SubDL API Key (Optional):",
                lblSubsourceLimit: "SubSource Results:",
                lblSubsourceKey: "SubSource API Key (Optional):",
                linkGetKey: "🔗 Get your key here",
                btnInstall: "Install Addon",
                footer: "Powered by Stremio Addon SDK"
            },
            zh: {
                pageTitle: "ST+ 设置",
                title: "ST+",
                subtitle: "多语言字幕 - v2.3.0",
                feature1: "⚡ 智能排序系统 (模糊匹配)",
                feature2: "🎯 支持: SubSource, SubDL, OpenSubtitles, YTS",
                lblMoreSubs: "获取更多字幕:",
                lblSubLang: "首选字幕语言:",
                lblOsCount: "OpenSubtitles 结果数:",
                lblYtsCount: "YTS 结果数:",
                lblSubdlLimit: "SubDL 结果数:",
                lblSubdlKey: "SubDL API 密钥 (可选):",
                lblSubsourceLimit: "SubSource 结果数:",
                lblSubsourceKey: "SubSource API 密钥 (可选):",
                linkGetKey: "🔗 在此获取密钥",
                btnInstall: "安装扩展",
                footer: "由 Stremio Addon SDK 强力驱动"
            }
        };

        function changeInterfaceLanguage() {
            const lang = document.getElementById('interfaceLang').value;
            const doc = document.documentElement;

            // Set Direction and Lang attribute
            doc.lang = lang;
            doc.dir = lang === 'ar' ? 'rtl' : 'ltr';

            // Apply translations
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) {
                    if (el.tagName === 'TITLE') {
                        // Plain text for title, handled with Unicode chars if needed
                        el.innerText = translations[lang][key];
                    } else {
                        // innerHTML for elements to support <span dir='ltr'> etc
                        el.innerHTML = translations[lang][key];
                    }
                }
            });

            // Update placeholders
            const keyPlaceholder = (lang === 'ar' || lang === 'zh') ? ((lang === 'ar') ? "أدخل المفتاح هنا..." : "输入密钥...") : "Enter API Key...";
            document.getElementById('subdlKey').placeholder = keyPlaceholder;
            document.getElementById('subsourceKey').placeholder = keyPlaceholder;
        }

        function getManifestUrl() {
            const lang = document.getElementById('lang').value;
            const osCount = document.getElementById('osCount').value;
            const ytsCount = document.getElementById('ytsCount').value;
            const subdlLimit = document.getElementById('subdlLimit').value;
            const subsourceLimit = document.getElementById('subsourceLimit').value;
            const subdlKey = document.getElementById('subdlKey').value;
            const subsourceKey = document.getElementById('subsourceKey').value;

            const config = {
                lang: lang,
                osCount: osCount,
                ytsCount: ytsCount,
                subdlLimit: subdlLimit,
                subsourceLimit: subsourceLimit,
                subdlKey: subdlKey,
                subsourceKey: subsourceKey
            };

            const configStr = btoa(JSON.stringify(config));

            let domain = window.location.host;
            let protocol = window.location.protocol;

            if (!domain || domain === "" || protocol === 'file:') {
                domain = "127.0.0.1:7000";
                protocol = "http:";
            }

            return `${protocol}//${domain}/${configStr}/manifest.json`;
        }

        function installAddon() {
            const manifestUrl = getManifestUrl();
            const stremioUrl = manifestUrl.replace("https://", "stremio://").replace("http://", "stremio://");
            console.log("Installing with:", stremioUrl);
            window.location.href = stremioUrl;
        }

        function initFromUrl() {
            try {
                const path = window.location.pathname;
                const parts = path.split('/');
                const configStr = parts.length > 2 ? parts[1] : null;

                if (configStr && !configStr.includes('configure') && configStr.length > 5) {
                    const decoded = atob(configStr);
                    if (decoded.trim().startsWith('{')) {
                        const config = JSON.parse(decoded);
                        if (config.lang) document.getElementById('lang').value = config.lang;
                        if (config.osCount) document.getElementById('osCount').value = config.osCount;
                        if (config.ytsCount) document.getElementById('ytsCount').value = config.ytsCount;
                        if (config.subdlLimit) document.getElementById('subdlLimit').value = config.subdlLimit;
                        if (config.subsourceLimit) document.getElementById('subsourceLimit').value = config.subsourceLimit;

                        if (config.subdlKey) document.getElementById('subdlKey').value = config.subdlKey;
                        if (config.subsourceKey) document.getElementById('subsourceKey').value = config.subsourceKey;
                    }
                }
            } catch (e) { console.log('Parsed config error', e); }

            // Initialize Lang
            changeInterfaceLanguage();
        }

        window.onload = initFromUrl;
    </script>
